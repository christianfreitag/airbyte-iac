name: 'AUTODRO:2 [GENERAL] -> SNOW : all_streams'
source: Postgres Autodro2.0 - General
destination: Snowflake - Autodromo 1.0
status: active
schedule_type: cron
schedule:
  cron:
    cronExpression: 0 15 2 * * ?
    cronTimeZone: America/Sao_Paulo
namespace_definition: destination
namespace_format: ''
prefix: v2_
tags:
- prod
- Ingest
- select:autodro_v2
streams:
- name: Account
  namespace: public
  sync_mode: incremental
  destination_sync_mode: append_dedup
  cursor_field:
  - id
  primary_key:
  - - id
  json_schema:
    type: object
    properties:
      id:
        type: string
      cnpj:
        type: string
      name:
        type: string
      avatar:
        type: string
      createdAt:
        type: string
        format: date-time
        airbyte_type: timestamp_without_timezone
      updatedAt:
        type: string
        format: date-time
        airbyte_type: timestamp_without_timezone
      accountType:
        type: string
  supported_sync_modes:
  - full_refresh
  - incremental
  default_cursor_field: []
  source_defined_cursor: false
  source_defined_primary_key:
  - - id
