  - full_refresh
  - incremental
  default_cursor_field: []
  source_defined_cursor: false
  source_defined_primary_key:
  - - id
- name: teams
  namespace: public
  sync_mode: incremental
  destination_sync_mode: append_dedup
  cursor_field:
  - updated_at
  primary_key:
  - - id
  json_schema:
    type: object
    properties:
      id:
        type: string
      name:
        type: string
      account_id:
        type: string
      created_at:
        type: string
        format: date-time
        airbyte_type: timestamp_without_timezone
      updated_at:
        type: string
        format: date-time
