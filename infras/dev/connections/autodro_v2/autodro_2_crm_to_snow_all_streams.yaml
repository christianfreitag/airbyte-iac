name: 'AUTODRO:2 [CRM] -> SNOW : all_streams'
source: Postgres Autodro2.0 - CRM
destination: Snowflake - Autodromo 1.0
status: active
schedule_type: cron
schedule:
  cron:
    cronExpression: 0 0 2 * * ?
    cronTimeZone: America/Sao_Paulo
namespace_definition: destination
namespace_format: ''
prefix: v2_
tags:
- prod
- Ingest
- select:autodro_v2
streams:
- name: contacts
  namespace: public
  sync_mode: incremental
  destination_sync_mode: append_dedup
  cursor_field:
  - id
  primary_key:
  - - id
  json_schema:
    type: object
    properties:
      id:
        type: string
      name:
        type: string
      email:
        type: string
      phone:
        type: string
      status:
        type: string
      accountId:
        type: string
      createdAt:
        type: string
        format: date-time
        airbyte_type: timestamp_without_timezone
      updatedAt:
        type: string
        format: date-time
        airbyte_type: timestamp_without_timezone
      temperature:
        type: string
  supported_sync_modes:
  - full_refresh
  - incremental
  default_cursor_field: []
  source_defined_cursor: false
  source_defined_primary_key:
  - - id
- name: conversions
  namespace: public
  sync_mode: incremental
  destination_sync_mode: append_dedup
  cursor_field:
  - id
  primary_key:
  - - id
  json_schema:
    type: object
    properties:
      id:
        type: string
      name:
        type: string
      email:
        type: string
      phone:
        type: string
      siteId:
        type: string
      status:
        type: string
      teamId:
        type: string
      unitId:
        type: string
      brandId:
        type: string
      channel:
        type: string
      product:
        type: string
      accountId:
        type: string
      contactId:
        type: string
      createdAt:
        type: string
        format: date-time
        airbyte_type: timestamp_without_timezone
      temperature:
        type: string
      customParameters:
        type: string
  supported_sync_modes:
  - full_refresh
  - incremental
  default_cursor_field: []
  source_defined_cursor: false
  source_defined_primary_key:
  - - id
- name: team_members
  namespace: public
  sync_mode: incremental
  destination_sync_mode: append_dedup
  cursor_field:
  - id
  primary_key:
  - - id
  json_schema:
    type: object
    properties:
      id:
        type: string
      email:
        type: string
      team_id:
        type: string
      created_at:
        type: string
        format: date-time
        airbyte_type: timestamp_without_timezone
