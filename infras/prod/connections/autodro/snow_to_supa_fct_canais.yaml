name: 'SNOW -> SUPA : fct_canais'
source: Snowflake Autodromo Gold
destination: Postgres
status: active
schedule_type: cron
schedule:
  cron:
    cronExpression: 0 30 23 ? * *
    cronTimeZone: America/Sao_Paulo
namespace_definition: destination
namespace_format: ''
prefix: ''
tags:
- prod
- Serving
- select:autodro
streams:
- name: FCT_CANAIS
  namespace: GOLD
  sync_mode: incremental
  destination_sync_mode: append_dedup
  cursor_field:
  - UPDATED_AT
  primary_key:
  - - CANAL_ID
  json_schema:
    type: object
    properties:
      SLUG:
        type: string
      CANAL_ID:
        type: string
      CONTA_ID:
        type: string
      MARCA_ID:
        type: string
      CANAL_NOME:
        type: string
      CONTA_NOME:
        type: string
      LOGO_WHITE:
        type: string
      MARCA_NOME:
        type: string
      UPDATED_AT:
        type: string
        format: date-time
        airbyte_type: timestamp_without_timezone
      CANAL_ATIVO:
        type: boolean
      CANAL_TOKEN:
        type: string
      CHANNEL_TYPE:
        type: string
      LOGO_REGULAR:
        type: string
      CANAL_DOMINIO:
        type: string
      AUTODRO_VERSION:
        type: number
      HOST_NORMALIZADO:
        type: string
  supported_sync_modes:
  - full_refresh
  - incremental
  default_cursor_field: []
  source_defined_cursor: false
  source_defined_primary_key: []
- name: FCT_CANAIS_TAGS
  namespace: GOLD
  sync_mode: incremental
  destination_sync_mode: append_dedup
  cursor_field:
  - ASSOCIATION_ID
  primary_key:
  - - CANAL_ID
  - - TAG_ID
  - - ASSOCIATION_ID
  json_schema:
    type: object
    properties:
      TAG:
        type: string
      TAG_ID:
        type: number
      CANAL_ID:
        type: number
      ASSOCIATION_ID:
        type: number
  supported_sync_modes:
  - full_refresh
  - incremental
  default_cursor_field: []
  source_defined_cursor: false
  source_defined_primary_key: []
- name: FCT_CANAIS_UNIT
  namespace: GOLD
  sync_mode: incremental
  destination_sync_mode: append_dedup
  cursor_field:
  - UPDATED_AT
  primary_key:
  - - HOST_NORMALIZADO
  - - UNIDADE_NOME
  json_schema:
    type: object
    properties:
      UNIDADE_ID:
        type: string
      UNIDADE_UF:
        type: string
      UPDATED_AT:
        type: string
        format: date-time
        airbyte_type: timestamp_without_timezone
      UNIDADE_NOME:
        type: string
      UNIDADE_CIDADE:
        type: string
      AUTODRO_VERSION:
        type: number
      HOST_NORMALIZADO:
        type: string
  supported_sync_modes:
  - full_refresh
  - incremental
  default_cursor_field: []
  source_defined_cursor: false
  source_defined_primary_key: []
