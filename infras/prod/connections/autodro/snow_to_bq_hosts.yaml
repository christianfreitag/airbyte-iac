name: 'SNOW -> BQ : hosts'
source: Snowflake Autodromo Gold
destination: BigQuery
status: active
schedule_type: cron
schedule:
  cron:
    cronExpression: 0 0 23 ? * *
    cronTimeZone: America/Sao_Paulo
namespace_definition: destination
namespace_format: ''
prefix: ''
tags:
- prod
- filtering
- select:autodro
streams:
- name: DIM_CHANNELS
  namespace: GOLD
  sync_mode: full_refresh
  destination_sync_mode: overwrite
  cursor_field:
  - UPDATED_AT
  primary_key:
  - - CHANNEL_ID
  json_schema:
    type: object
    properties:
      CHANNEL_ID:
        type: string
      UPDATED_AT:
        type: string
        format: date-time
        airbyte_type: timestamp_without_timezone
      AUTODRO_VERSION:
        type: number
      HOST_NORMALIZADO:
        type: string
  supported_sync_modes:
  - full_refresh
  - incremental
  default_cursor_field: []
  source_defined_cursor: false
  source_defined_primary_key: []
